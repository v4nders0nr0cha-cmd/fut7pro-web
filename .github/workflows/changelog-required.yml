name: Changelog Required

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog-required:
    name: Changelog Required
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed files
        shell: bash
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.txt

      - name: Validate changelog requirement
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_BACKEND_TOKEN || secrets.GITHUB_TOKEN }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES_PATH: changed-files.txt
          BACKEND_CHANGELOG_REPO: v4nders0nr0cha-cmd/fut7pro-backend
          BACKEND_CHANGELOG_PATH: src/modules/changelog/changelog.entries.ts
        run: node scripts/check-changelog-required.cjs
