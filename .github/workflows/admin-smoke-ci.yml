name: Admin Smoke CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: admin-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.19.0"

defaults:
  run:
    shell: bash

jobs:
  superadmin-legacy-security:
    name: SuperAdmin Legacy Security Smoke
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create local env for SuperAdmin security smoke
        run: |
          {
            echo "NEXT_PUBLIC_API_URL=https://api.fut7pro.com.br"
            echo "API_URL=https://api.fut7pro.com.br"
            echo "BACKEND_URL=https://api.fut7pro.com.br"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            echo "NEXTAUTH_URL=http://127.0.0.1:3000"
            echo "NEXTAUTH_SECRET=ci-superadmin-legacy-smoke"
            echo "DISABLE_WEB_DIRECT_DB=true"
            echo "SUPERADMIN_ENABLE_LEGACY_ROUTES=false"
            echo "NODE_ENV=test"
          } > .env.local

      - name: Run SuperAdmin legacy security smoke (mandatory)
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          SUPERADMIN_ENABLE_LEGACY_ROUTES: "false"
        run: pnpm exec playwright test tests/security/superadmin-legacy-block.spec.ts --project=chromium --workers=1 --reporter=line

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-legacy-security-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  admin-smoke:
    name: Admin Smoke Navigation
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 45
    env:
      ADMIN_SMOKE_FIXTURE: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4317
      API_URL: http://127.0.0.1:4317
      BACKEND_URL: http://127.0.0.1:4317
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-admin-fixture-only-secret
      NEXT_PUBLIC_TURNSTILE_ENABLED: "false"
      DISABLE_WEB_DIRECT_DB: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create local env for CI web server
        run: |
          {
            echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
            echo "API_URL=${API_URL}"
            echo "BACKEND_URL=${BACKEND_URL}"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            echo "NEXTAUTH_URL=http://127.0.0.1:3000"
            echo "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}"
            echo "DISABLE_WEB_DIRECT_DB=true"
          } > .env.local

      - name: Build isolated admin frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --require ./tests/admin/deny-production-api.cjs
        run: pnpm build

      - name: Run admin smoke (mandatory)
        env:
          NODE_OPTIONS: --require ./tests/admin/deny-production-api.cjs
          PLAYWRIGHT_WEB_SERVER: "1"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          PLAYWRIGHT_JSON_OUTPUT_FILE: "test-results/admin-smoke-report.json"
        run: |
          pnpm exec playwright test tests/admin/admin-smoke-navigation.spec.ts --project=chromium --workers=1 --reporter=line,json
          node <<'NODE'
          const report = require('./test-results/admin-smoke-report.json');
          if (report.stats.skipped > 0) {
            console.error(`Admin smoke: ${report.stats.skipped} cenário(s) ignorado(s).`);
            const visit = (suite) => {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  for (const note of test.annotations || []) {
                    if (note.type === 'skip') console.error(`${spec.title}: ${note.description}`);
                  }
                }
              }
              for (const child of suite.suites || []) visit(child);
            };
            for (const suite of report.suites || []) visit(suite);
            process.exit(1);
          }
          NODE

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-smoke-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
