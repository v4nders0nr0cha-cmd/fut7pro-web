name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches:
      [main, develop, "fix/billing-phase1-scope-20261122", "feat/subscription-central-web-20261122"]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.19.0"

jobs:
  # Job de qualidade de código
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript check
        run: pnpm run type-check

      - name: Run Prettier check
        run: pnpm run format:check

  # Job de testes
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:ci

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()

  # Job de build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          cp env.example .env.local
          echo "NEXT_PUBLIC_API_URL=https://api-staging.fut7pro.com" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=https://staging.fut7pro.com" >> .env.local

      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next/
          retention-days: 1

  # Job de análise de bundle
  analyze:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          cp env.example .env.local
          echo "NEXT_PUBLIC_API_URL=https://api-staging.fut7pro.com" >> .env.local

      - name: Analyze bundle
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run analyze

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: .next/analyze/
          retention-days: 7

  # Job de segurança
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate SCA allowlist policy
        run: pnpm run security:sca:allowlist

      - name: Verify consumers covered by temporary exceptions
        run: node scripts/security/check-reviewed-usage.js

      - name: Collect production dependency audit
        run: |
          audit_status=0
          pnpm audit --prod --json > security-audit.json || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi

      - name: Enforce reviewed high and critical risks
        run: node scripts/security/evaluate-audit.js security-audit.json security-triage.json

      - name: Additional free OSV analysis
        continue-on-error: true
        run: |
          pnpm list --prod --depth Infinity --json > dependency-tree.json
          node scripts/security/osv-scan.js dependency-tree.json security-osv.json

      - name: Publish dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscription-security-audit
          path: |
            security-audit.json
            security-triage.json
            security-osv.json
            security-usage.json
          if-no-files-found: warn
          retention-days: 30

      - name: Explain security coverage
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lines = ['## Security coverage', '', 'Critical risks always block. High risks block unless the exact advisory, installed version and dependency path have a reviewed, evidenced and unexpired exception. Low and moderate findings remain visible. A green job does not mean there are no vulnerabilities.'];
          if (fs.existsSync('security-audit.json')) {
            const report = JSON.parse(fs.readFileSync('security-audit.json', 'utf8'));
            lines.push('', 'Dependency findings: ' + JSON.stringify(report.metadata?.vulnerabilities || report.error || 'See audit artifact.'));
          }
          lines.push('', process.env.SNYK_TOKEN ? 'Snyk token is configured; consult the scan step for its result.' : 'Snyk was not executed: SNYK_TOKEN is not configured.');
          if (fs.existsSync('security-osv.json')) {
            const osv = JSON.parse(fs.readFileSync('security-osv.json', 'utf8'));
            lines.push('', 'Additional free OSV analysis: ' + osv.status + (osv.error ? ' — ' + osv.error : ' (' + osv.queriedPackages + ' package versions).'));
          } else lines.push('', 'Additional OSV analysis was not executed.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Run Snyk security scan
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce
        if: env.SNYK_TOKEN != ''
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Skip Snyk scan (token not configured)
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN não configurado. Etapa Snyk ignorada."

  docker-lock:
    name: Docker canonical lock compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build an isolated validation image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://127.0.0.1:4317 -t fut7pro-security-validation .
      - name: Verify the production image runtime
        run: |
          docker run --rm fut7pro-security-validation node -e "if (process.getuid() === 0) process.exit(1); if (typeof require('@prisma/client').PrismaClient !== 'function') process.exit(1); console.log('Production modules and non-root runtime verified');"

  # Job de deploy preview (apenas para PRs)
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: github.event_name == 'pull_request'
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          cp env.example .env.local
          echo "NEXT_PUBLIC_API_URL=https://api-staging.fut7pro.com" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=https://staging.fut7pro.com" >> .env.local

      - name: Build for preview
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Check Vercel secrets availability
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip preview deploy (Vercel secrets ausentes)
        if: steps.vercel_secrets.outputs.enabled != 'true'
        run: echo "Credenciais da Vercel nao configuradas. Deploy Preview ignorado sem falhar."

      - name: Deploy to Vercel Preview
        if: steps.vercel_secrets.outputs.enabled == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

  # Job de notificação
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [quality, test, build, security]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Notify Slack on failure
        uses: 8398a7/action-slack@v3
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        with:
          status: failure
          text: "❌ Frontend CI/CD failed for ${{ github.repository }}#${{ github.run_number }}"
          channel: "#devops"
          username: "GitHub Actions"

      - name: Notify Slack on success
        uses: 8398a7/action-slack@v3
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        with:
          status: success
          text: "✅ Frontend CI/CD passed for ${{ github.repository }}#${{ github.run_number }}"
          channel: "#devops"
          username: "GitHub Actions"

      - name: Skip Slack notification (webhook not configured)
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "SLACK_WEBHOOK_URL não configurado. Notificação ignorada."
