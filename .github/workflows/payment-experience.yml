name: Payment Experience
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/billing/central/**"
      - "src/components/ui/feedback/Fut7DialogBase.tsx"
      - "src/lib/api/billing.ts"
      - "tests/payment-experience.fixture.spec.ts"
      - ".github/workflows/payment-experience.yml"
permissions:
  contents: read
jobs:
  payment:
    name: Payment UX (${{ matrix.version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    env:
      ADMIN_SMOKE_FIXTURE: "1"
      FIXTURE_TLS_KEY: /tmp/admin-fixture.key
      FIXTURE_TLS_CERT: /tmp/admin-fixture.crt
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4317
      API_URL: http://127.0.0.1:4317
      BACKEND_URL: http://127.0.0.1:4317
      NEXT_PUBLIC_APP_URL: https://127.0.0.1:3443
      NEXTAUTH_URL: https://127.0.0.1:3443
      NEXTAUTH_SECRET: ci-payment-fixture-only-secret
      NEXT_PUBLIC_TURNSTILE_ENABLED: "false"
      DISABLE_WEB_DIRECT_DB: "true"
      PLAYWRIGHT_BASE_URL: https://127.0.0.1:3443
      PLAYWRIGHT_WEB_SERVER: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.version == 'before' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
      - name: Use same fixture for baseline
        if: matrix.version == 'before'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git show "$HEAD_SHA:tests/payment-experience.fixture.spec.ts" > tests/payment-experience.fixture.spec.ts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolated environment
        run: |
          printf '%s\n' "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" "API_URL=$API_URL" "BACKEND_URL=$BACKEND_URL" "NEXTAUTH_URL=$NEXTAUTH_URL" "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" "DISABLE_WEB_DIRECT_DB=true" > .env.local
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$FIXTURE_TLS_KEY" -out "$FIXTURE_TLS_CERT" -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build against simulated provider
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --require ./tests/admin/deny-production-api.cjs
        run: pnpm build
      - name: Test and capture four viewports
        env:
          PAYMENT_CAPTURE_BASELINE: ${{ matrix.version == 'before' && '1' || '0' }}
        run: pnpm exec playwright test tests/payment-experience.fixture.spec.ts --project=chromium --project=webkit --workers=1 --reporter=line --output=test-results/payment-${{ matrix.version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-ux-${{ matrix.version }}
          path: test-results/payment-${{ matrix.version }}
          retention-days: 30
